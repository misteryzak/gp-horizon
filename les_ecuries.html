<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Écuries — GP HORIZON</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#E74C3C;--accent:#F39C12;--light:#f0f0f0;--dark:#0a0a14;--darker:#050508;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;color:#fff;min-height:100vh;
background:#050508;
background-image:
  radial-gradient(ellipse at 20% 50%, rgba(100,0,200,0.06) 0%, transparent 60%),
  radial-gradient(ellipse at 80% 20%, rgba(0,100,255,0.05) 0%, transparent 60%);
}

/* Navigation Menu */
.navbar { position: fixed; top: 0; left: 0; right: 0; background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(10px); z-index: 9999; border-bottom: 2px solid rgba(231, 76, 60, 0.3); }
.nav-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: center; gap: 40px; align-items: center; padding: 15px 10px 15px 10px; }
.nav-logo { font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; cursor: pointer; white-space: nowrap; }
.nav-menu { display: flex; gap: 5px; list-style: none; }
.nav-item { position: relative; }
.nav-link { display: flex; align-items: center; gap: 5px; padding: 12px 20px; color: var(--light); text-decoration: none; font-weight: 600; transition: all 0.3s ease; border-radius: 8px; }
.nav-link:hover { background: rgba(231, 76, 60, 0.2); color: var(--primary); }
.nav-link.active { background: var(--primary); color: white; }

/* DROPDOWN MENU */
.nav-dropdown { position: relative; }
.nav-dropdown .nav-link { cursor: pointer; }
.dropdown-menu { display: none !important; position: absolute; top: calc(100% + 10px); left: 0; background: rgba(10, 10, 20, 0.98); backdrop-filter: blur(10px); border: 1px solid rgba(231, 76, 60, 0.3); border-radius: 12px; min-width: 200px; z-index: 99999; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: dropdownFade 0.2s ease; }
.dropdown-menu.open { display: block !important; pointer-events: auto; }
@keyframes dropdownFade { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.nav-dropdown .dropdown-menu { pointer-events: none; }
.nav-dropdown .dropdown-menu.open { pointer-events: auto; }
.dropdown-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: var(--light); text-decoration: none; font-weight: 600; transition: all 0.2s ease; border-bottom: 1px solid rgba(255,255,255,0.05); }
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: rgba(231, 76, 60, 0.2); color: var(--primary); padding-left: 25px; }
.dropdown-item i { width: 20px; text-align: center; color: var(--primary); }

/* Mobile Menu */
.nav-toggle { display: none; background: none; border: none; color: var(--light); font-size: 1.5rem; cursor: pointer; }
@media (max-width: 968px) {
  .nav-menu { position: fixed; left: -100%; top: 70px; flex-direction: column; background: rgba(10, 10, 20, 0.98); width: 100%; padding: 20px; transition: left 0.3s ease; border-top: 2px solid var(--primary); }
  .nav-menu.active { left: 0; }
  .nav-toggle { display: block; }
}

.bd{display:none;position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,0.8);}
.bd.show{display:block;}
.me{display:none;position:fixed;top:64px;left:0;right:0;z-index:10001;background:#080810;border-bottom:1px solid rgba(255,255,255,0.05);box-shadow:0 20px 60px rgba(0,0,0,0.9);}
.me.show{display:block;}
.me-wrap{max-width:1500px;margin:0 auto;padding:14px 20px 0;}
.me-grid-row{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:2px;}
.mc{display:flex;flex-direction:column;text-decoration:none;overflow:hidden;background:#10101a;border:1px solid rgba(255,255,255,0.05);height:100px;transition:background 0.2s;}
.mc:hover{background:#161624;}
.mc-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0a0a12;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.05);height:46px;}
.mc-logo{width:30px;height:30px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:900;}
.mc-logo img{width:100%;height:100%;object-fit:cover;}
.mc-name{flex:1;min-width:0;font-size:0.72rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mc-arr{font-size:0.7rem;color:rgba(255,255,255,0.2);transition:color 0.2s,transform 0.2s;}
.mc:hover .mc-arr{color:var(--primary);transform:translateX(3px);}
.mc-bot{flex:1;position:relative;overflow:hidden;background:#000;}
.mc-bot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
.mc.plus{background:rgba(231,76,60,0.04);border:1px dashed rgba(231,76,60,0.2);}
.mc.blank{background:rgba(255,255,255,0.005);border-color:transparent;pointer-events:none;}
.me-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;border-top:1px solid rgba(255,255,255,0.05);margin-top:12px;}
.me-foot span{font-size:0.65rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.2);}
.me-foot-links{display:flex;gap:4px;}
.me-foot-links a{display:flex;align-items:center;gap:6px;padding:6px 12px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:0.65rem;font-weight:600;text-transform:uppercase;border-radius:6px;transition:all 0.2s;border:1px solid transparent;}
.me-foot-links a:hover{color:#fff;background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.07);}
.me-foot-links a i{color:var(--primary);}

/* PAGE */
.page{max-width:1400px;margin:0 auto;padding:90px 32px 80px;}
.page-title{
    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(5rem,12vw,9rem);font-weight:900;font-style:italic;
    text-transform:uppercase;line-height:0.88;margin-bottom:40px;letter-spacing:-2px;
    color:#fff;
    /* Texte néon */
    text-shadow: 0 0 40px rgba(231,76,60,0.4), 0 0 80px rgba(231,76,60,0.15);
}
.page-title span{
    color:var(--primary);
    text-shadow: 0 0 20px rgba(231,76,60,0.8), 0 0 60px rgba(231,76,60,0.4);
}
.ecuries-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;}

/* CARD */
.ecurie-card{
    position:relative;overflow:hidden;
    text-decoration:none;display:block;
    transition:transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease;
    border:1px solid rgba(255,255,255,0.06);
}
.ecurie-card:hover{transform:translateY(-5px);z-index:2;}

/* Zone voiture — noir avec néons */
.ec-car-zone{
    position:relative;height:270px;overflow:hidden;
    background:#06060c;
}

/* Sol réfléchissant */
.ec-floor{
    position:absolute;
    bottom:0;left:0;right:0;height:60px;
    z-index:2;
    background:linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 100%);
}
.ec-floor-reflect{
    position:absolute;
    bottom:0;left:0;right:0;height:2px;
    z-index:3;
    /* Ligne lumineuse au sol */
    background:linear-gradient(90deg, transparent 0%, currentColor 20%, currentColor 80%, transparent 100%);
    filter:blur(1px);
    opacity:0.6;
}

/* Rayons de lumière */
.ec-beams{
    position:absolute;inset:0;z-index:1;
    background:
        conic-gradient(from 200deg at 110% 120%, transparent 0deg, rgba(255,255,255,0.015) 15deg, transparent 30deg),
        conic-gradient(from 160deg at -10% 120%, transparent 0deg, rgba(255,255,255,0.012) 20deg, transparent 40deg);
    pointer-events:none;
}

/* Glow sol couleur */
.ec-glow-floor{
    position:absolute;
    bottom:-20px;left:50%;transform:translateX(-50%);
    width:75%;height:80px;
    border-radius:50%;filter:blur(35px);
    opacity:0.45;z-index:2;
    transition:opacity 0.4s, transform 0.4s;
}
.ecurie-card:hover .ec-glow-floor{opacity:0.8;transform:translateX(-50%) scaleX(1.2);}

/* Halo ambiant */
.ec-ambient{
    position:absolute;
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:60%;height:60%;
    border-radius:50%;filter:blur(50px);
    opacity:0.08;z-index:1;
    transition:opacity 0.4s;
}
.ecurie-card:hover .ec-ambient{opacity:0.18;}

/* Bord lumineux en bas */
.ec-car-zone::after{
    content:'';
    position:absolute;bottom:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, currentColor 30%, currentColor 70%, transparent);
    z-index:10;opacity:0.5;
}

/* Voiture */
.ec-car-zone img.car{
    position:absolute;
    bottom:0;left:50%;transform:translateX(-50%);
    width:95%;height:100%;
    object-fit:contain;object-position:center bottom;
    z-index:4;
    transition:transform 0.5s cubic-bezier(0.16,1,0.3,1),filter 0.4s;
    filter:none;
}
.ecurie-card:hover .ec-car-zone img.car{
    transform:translateX(-50%) scale(1.04) translateY(-4px);
    filter:none;
}

/* Header */
.ec-header{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;align-items:flex-start;justify-content:space-between;z-index:5;}
.ec-header-left{display:flex;flex-direction:column;gap:8px;}
.ec-name{
    font-family:'Barlow Condensed',sans-serif;
    font-size:1.9rem;font-weight:900;text-transform:uppercase;
    color:#fff;line-height:1;display:inline-block;padding:3px 10px;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
}
.ec-logo-box{
    width:50px;height:50px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:5px;font-size:1.1rem;font-weight:900;
    box-shadow:0 0 20px rgba(255,255,255,0.15), 0 4px 16px rgba(0,0,0,0.6);
}
.ec-logo-box img{width:100%;height:100%;object-fit:contain;}
.ec-arrow{
    width:44px;height:44px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:0.9rem;flex-shrink:0;
    transition:all 0.25s;
}
.ecurie-card:hover .ec-arrow{
    background:var(--primary);border-color:var(--primary);
    box-shadow:0 0 20px rgba(231,76,60,0.5);
    transform:translateX(4px);
}

/* Stripe néon */
.ec-stripe{
    height:2px;width:100%;
    filter:blur(0.5px);
    box-shadow:0 0 8px currentColor;
}

/* Bande pilotes */
.ec-pilots{
    display:grid;grid-template-columns:1fr 1fr;
    height:158px;position:relative;overflow:hidden;
    background:#08080f;
}
/* Scan line animé */
@keyframes scan{0%{transform:translateY(-100%);}100%{transform:translateY(400%);}}
.ec-pilots::before{
    content:'';position:absolute;left:0;right:0;height:2px;top:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation:scan 4s linear infinite;
    z-index:10;pointer-events:none;
}
/* Divider néon vertical */
.ec-pilots::after{
    content:'';position:absolute;top:0;bottom:0;left:50%;
    width:1px;z-index:5;
    box-shadow:0 0 8px currentColor;
    transform:translateX(-50%);
}
.ec-pilot{position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px 14px;}
/* Grille techno en fond */
.ec-pilot::before{
    content:'';position:absolute;inset:0;z-index:1;
    background:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:20px 20px;
}
.ec-pilot-photo{
    position:absolute;bottom:0;height:150px;
    object-fit:contain;object-position:bottom;z-index:2;
    transition:transform 0.4s cubic-bezier(0.16,1,0.3,1), filter 0.3s;
    filter:drop-shadow(0 0 15px rgba(255,255,255,0.08));
}
.ecurie-card:hover .ec-pilot-photo{
    transform:scale(1.05) translateY(-2px);
    filter:drop-shadow(0 0 20px rgba(255,255,255,0.15));
}
.ec-pilot:first-child .ec-pilot-photo{right:8px;}
.ec-pilot:last-child .ec-pilot-photo{left:8px;}
.ec-pilot-info{position:relative;z-index:3;display:flex;flex-direction:column;}
.ec-pilot:first-child .ec-pilot-info{align-items:flex-start;}
.ec-pilot:last-child .ec-pilot-info{align-items:flex-end;margin-left:auto;}
.ec-pilot-num{
    font-family:'Barlow Condensed',sans-serif;
    font-size:4rem;font-weight:900;line-height:0.85;color:#fff;
    /* Néon num */
    text-shadow: 0 0 20px currentColor, 0 0 40px rgba(255,255,255,0.2), 2px 2px 0 rgba(0,0,0,0.8);
}
.ec-pilot-name{
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.95rem;font-weight:800;text-transform:uppercase;
    color:rgba(255,255,255,0.9);letter-spacing:1.5px;
    text-shadow:0 0 10px rgba(255,255,255,0.3);
}
.ec-pilot-empty{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.15);font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;width:100%;}

/* Card créer */
.create-card{
    border:1px solid rgba(231,76,60,0.2)!important;
    background:rgba(231,76,60,0.03)!important;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;min-height:180px;
    box-shadow:inset 0 0 40px rgba(231,76,60,0.04);
}
.create-card:hover{
    background:rgba(231,76,60,0.06)!important;
    border-color:rgba(231,76,60,0.35)!important;
    box-shadow:inset 0 0 40px rgba(231,76,60,0.08), 0 0 30px rgba(231,76,60,0.15)!important;
}
.create-icon{
    width:56px;height:56px;border-radius:50%;
    border:1px solid rgba(231,76,60,0.3);
    display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--primary);
    transition:transform 0.3s, box-shadow 0.3s;
    box-shadow:0 0 15px rgba(231,76,60,0.2);
}
.create-card:hover .create-icon{transform:rotate(90deg);box-shadow:0 0 25px rgba(231,76,60,0.4);}
.create-label{font-size:0.72rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(231,76,60,0.45);}
.spin{display:flex;align-items:center;justify-content:center;gap:12px;padding:80px;color:rgba(255,255,255,0.3);font-size:0.72rem;letter-spacing:3px;text-transform:uppercase;}
@media(max-width:900px){.ecuries-grid{grid-template-columns:1fr;}.page{padding:80px 16px 60px;}}
</style>
</head>

      }
    }
    wrap.appendChild(row);
  }
}

function buildCard(ec,idx,pilotes){
  const nom=g(ec,CN)||'Écurie '+(idx+1),logo=g(ec,CL),car=g(ec,CC)||CAR_DEMO,col=g(ec,CK)||COLORS[idx%COLORS.length],id=sl(nom),init=nom[0].toUpperCase();
  const [r,gv,b]=hex2rgb(col);
  const myP=pilotes.filter(p=>{const pe=g(p,PE,'').toLowerCase();return pe===nom.toLowerCase()||pe===id;});
  const p1=myP[0]||null,p2=myP[1]||null;

  function pilotHTML(p){
    if(!p)return`<div class="ec-pilot ec-pilot-empty">—</div>`;
    const pn=g(p,PN)||'Pilote',pu=g(p,PU,''),ph=g(p,PP);
    return`<div class="ec-pilot">
      ${ph?`<img class="ec-pilot-photo" src="${ph}" alt="${pn}" onerror="this.style.display='none'">`:''}
      <div class="ec-pilot-info">
        <div class="ec-pilot-num" style="color:${col};text-shadow:0 0 20px ${col},0 0 40px rgba(${r},${gv},${b},0.4),2px 2px 0 rgba(0,0,0,0.8)">${pu}</div>
        <div class="ec-pilot-name">${pn}</div>
      </div>
    </div>`;
  }

  const logoHTML=logo
    ?`<div class="ec-logo-box"><img src="${logo}" alt="" onerror="this.style.display='none'"></div>`
    :`<div class="ec-logo-box" style="background:${col};color:#fff;font-weight:900;font-size:1.1rem;box-shadow:0 0 20px rgba(${r},${gv},${b},0.4)">${init}</div>`;

  const div=document.createElement('a');div.className='ecurie-card';div.id=id;div.href='#'+id;

  // Border néon sur la card
  div.style.boxShadow=`0 0 0 1px rgba(${r},${gv},${b},0.15), inset 0 0 30px rgba(${r},${gv},${b},0.03)`;
  div.addEventListener('mouseenter',()=>{div.style.boxShadow=`0 0 0 1px rgba(${r},${gv},${b},0.4), 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(${r},${gv},${b},0.1)`;});
  div.addEventListener('mouseleave',()=>{div.style.boxShadow=`0 0 0 1px rgba(${r},${gv},${b},0.15), inset 0 0 30px rgba(${r},${gv},${b},0.03)`;});

  div.innerHTML=`
    <div class="ec-car-zone">
      <div class="ec-beams"></div>
      <div class="ec-ambient" style="background:${col}"></div>
      <div class="ec-glow-floor" style="background:${col}"></div>
      <div class="ec-floor"></div>
      <div class="ec-floor-reflect" style="color:${col};background:linear-gradient(90deg,transparent,${col},transparent)"></div>
      <img class="car" src="${car}" alt="${nom}">
      <div class="ec-header">
        <div class="ec-header-left">
          <div class="ec-name" style="border-left:3px solid ${col};text-shadow:0 0 20px rgba(${r},${gv},${b},0.5)">${nom}</div>
          ${logoHTML}
        </div>
        <div class="ec-arrow"><i class="fas fa-chevron-right"></i></div>
      </div>
    </div>
    <div class="ec-stripe" style="background:${col};color:${col};box-shadow:0 0 10px ${col},0 0 20px rgba(${r},${gv},${b},0.5)"></div>
    <div class="ec-pilots" style="background:#08080f">
      <div style="position:absolute;top:0;bottom:0;left:50%;width:1px;background:${col};box-shadow:0 0 8px ${col};z-index:5"></div>
      ${pilotHTML(p1)}${pilotHTML(p2)}
    </div>`;
  return div;
}

async function init(){
  let ec=DEMO,pi=[];
  try{
    const [er,pr]=await Promise.all([fetch(GAS+'?sheet=Ecuries'),fetch(GAS+'?sheet=Pilotes')]);
    const [ed,pd]=await Promise.all([er.json(),pr.json()]);
    if(Array.isArray(ed)&&ed.length)ec=ed;
    if(Array.isArray(pd)&&pd.length)pi=pd;
  }catch(e){}
  renderMe(ec);
  const wrap=document.getElementById('wrap');wrap.innerHTML='';
  ec.forEach((e,i)=>wrap.appendChild(buildCard(e,i,pi)));
  const cc=document.createElement('a');cc.href='ecurie.html';cc.className='ecurie-card create-card';
  cc.innerHTML=`<div class="create-icon"><i class="fas fa-plus"></i></div><div class="create-label">Créer une écurie</div>`;
  wrap.appendChild(cc);
}
init();

// Mobile menu toggle
const navToggle = document.getElementById('navToggle');
const navMenu = document.getElementById('navMenu');
if (navToggle) {
  navToggle.addEventListener('click', () => {
    navMenu.classList.toggle('active');
    const icon = navToggle.querySelector('i');
    icon.classList.toggle('fa-bars');
    icon.classList.toggle('fa-times');
  });
}

// Mega Menu
const ME=document.getElementById('me'),BD=document.getElementById('bd'),ECB=document.getElementById('ec-btn'),ECI=document.getElementById('ec-item');
function closeAllDropdowns(){document.querySelectorAll('.dropdown-menu.open').forEach(d=>d.classList.remove('open'));}
function openMe(){ME.classList.add('show');BD.classList.add('show');ECI.classList.add('open');closeAllDropdowns();}
function closeMe(){ME.classList.remove('show');BD.classList.remove('show');ECI.classList.remove('open');}
ECB.addEventListener('click',e=>{e.stopPropagation();if(window.innerWidth<768){window.location.href='les_ecuries.html';return;}ME.classList.contains('show')?closeMe():openMe();});
BD.addEventListener('click',closeMe);
document.addEventListener('click',e=>{if(!ME.contains(e.target)&&e.target!==ECB&&!ECB.contains(e.target))closeMe();});
ME.addEventListener('click',e=>e.stopPropagation());
window.addEventListener('resize',()=>{if(window.innerWidth<768)closeMe();});

// Dropdown menus
document.querySelectorAll('.nav-dropdown').forEach(dropdown => {
  const trigger = dropdown.querySelector('.nav-link');
  const menu = dropdown.querySelector('.dropdown-menu');
  if (trigger && menu) {
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = menu.classList.contains('open');
      closeAllDropdowns();
      closeMe();
      if (!isOpen) menu.classList.add('open');
    });
  }
});
document.addEventListener('click', closeAllDropdowns);
</script>
